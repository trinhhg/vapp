build:
  maxIssues: 0

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
    excludes: ['**/test/**', '**/androidTest/**']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Za-z0-9]*'
  VariableNaming:
    excludes: ['**/test/**']
  MatchingDeclarationName:
    active: false

coroutines:
  InjectDispatcher:
    active: false
  SleepInsteadOfDelay:
    active: false

empty-blocks:
  EmptyFunctionBlock:
    ignoreOverridden: true

style:
  MaxLineLength:
    maxLineLength: 140
  MagicNumber:
    active: false
  ReturnCount:
    active: false
  WildcardImport:
    active: false
  ForbiddenComment:
    active: false
  LoopWithTooManyJumpStatements:
    active: false
  ThrowsCount:
    active: false
  DestructuringDeclarationWithTooManyEntries:
    active: false
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  UseRequire:
    active: false
  UseCheckOrError:
    active: false
  FunctionOnlyReturningConstant:
    active: false
  ExplicitItLambdaParameter:
    active: false

complexity:
  TooManyFunctions:
    active: false
  LongParameterList:
    active: false
  LongMethod:
    threshold: 160
    ignoreAnnotated: ['Composable']
  CyclomaticComplexMethod:
    threshold: 25
    ignoreAnnotated: ['Composable']
  ComplexCondition:
    threshold: 6
  NestedBlockDepth:
    threshold: 6

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false
  TooGenericExceptionThrown:
    active: false

potential-bugs:
  UnsafeCallOnNullableType:
    excludes: ['**/test/**', '**/androidTest/**']
